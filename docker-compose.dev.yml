services:
  postgres-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-thegrapht_dev}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-thegrapht_dev}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-thegrapht_dev} -d ${DEV_POSTGRES_DB:-thegrapht_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  backend-dev:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: node --watch src/index.js
    volumes:
      - backend_dev_logs:/app/logs
      - /root/thegrapht-data/uploads-dev:/app/uploads
      - ./apps/backend/src:/app/apps/backend/src
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      POSTGRES_HOST: postgres-dev
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DEV_POSTGRES_DB:-thegrapht_dev}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-thegrapht_dev}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${DEV_JWT_SECRET:-${JWT_SECRET}}
      JWT_EXPIRES_IN: 30d
      SESSION_COOKIE_NAME: thegrapht_dev_session
      SESSION_COOKIE_DOMAIN: ${DEV_SESSION_COOKIE_DOMAIN:-dev.thegrapht.su}
      UPLOADS_DIR: /app/uploads
      ENABLE_INFRA_CHECKS: "false"
      RUN_MIGRATIONS_ON_BOOT: "true"
      SEED_DATABASE_ON_BOOT: "true"
      LOG_FILE: ""
      CORS_ALLOWED_ORIGINS: "https://dev.thegrapht.su,http://localhost:5185,http://127.0.0.1:5185"
      SECURE_DIRECT_CHATS_ENABLED: "true"
      SMTP_HOST: postfix
      SMTP_PORT: 25
      SMTP_SECURE: "false"
      SMTP_FROM: noreply@thegrapht.su
      RATE_LIMIT_AUTH_WINDOW_MS: 1000
      RATE_LIMIT_AUTH_MAX: 10000
      RATE_LIMIT_MESSAGE_WINDOW_MS: 1000
      RATE_LIMIT_MESSAGE_MAX: 10000
      RATE_LIMIT_SEARCH_WINDOW_MS: 1000
      RATE_LIMIT_SEARCH_MAX: 10000
      RATE_LIMIT_GENERAL_WINDOW_MS: 1000
      RATE_LIMIT_GENERAL_MAX: 50000
      TELEGRAM_BOT_TOKEN: ${DEV_TELEGRAM_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN}}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres-dev:
        condition: service_healthy
      postfix:
        condition: service_started

  mtproto-dev:
    build:
      context: .
      dockerfile: apps/mtproto/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3110:3100"
    environment:
      PORT: 3100
      HOST: 0.0.0.0
      JWT_SECRET: ${DEV_JWT_SECRET:-${JWT_SECRET}}
      CORS_ALLOWED_ORIGINS: "https://dev.thegrapht.su,http://localhost:5185,http://127.0.0.1:5185"
      MTPROTO_MAX_JSON_BODY_BYTES: "65536"
      MTPROTO_MAX_FRAME_BYTES: "1048576"
      MTPROTO_SESSION_TTL_MS: "1200000"
      MTPROTO_CHALLENGE_TTL_MS: "90000"
      MTPROTO_REQUEST_BODY_TIMEOUT_MS: "25000"
      MTPROTO_KEEPALIVE_TIMEOUT_MS: "65000"
      MTPROTO_HEADERS_TIMEOUT_MS: "70000"

  frontend-dev:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./res:/app/res
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      VITE_API_BASE_URL: ${DEV_VITE_API_BASE_URL:-}
      VITE_WS_BASE_URL: ${DEV_VITE_WS_BASE_URL:-}
      VITE_MTPROTO_BASE_URL: ${DEV_VITE_MTPROTO_BASE_URL:-}
      VITE_WEBRTC_ICE_SERVERS: "[{\"urls\":[\"stun:${TURN_PUBLIC_HOST}:3478\"]},{\"urls\":[\"turn:${TURN_PUBLIC_HOST}:3478?transport=udp\",\"turn:${TURN_PUBLIC_HOST}:3478?transport=tcp\"],\"username\":\"${TURN_USERNAME}\",\"credential\":\"${TURN_PASSWORD}\"}]"
    ports:
      - "127.0.0.1:5185:5173"
    depends_on:
      - backend-dev
      - mtproto-dev
      - turn
      - ollama-dev

  ollama-dev:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_dev_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  turn:
    ports:
      - "3479:3478/tcp"
      - "3479:3478/udp"
      - "5350:5349/tcp"
      - "5350:5349/udp"
      - "56000-56100:55000-55100/tcp"
      - "56000-56100:55000-55100/udp"

  open-webui-dev:
    build:
      context: ./apps/open-webui
      dockerfile: Dockerfile
    container_name: thegrapht-dev-openwebui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - open_webui_dev_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URLS=http://host.docker.internal:10000/v1
      - OPENAI_API_KEYS=thegrapht-cocoon
      - WEBUI_AUTH=True
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-User-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-User-Name
      - WEBUI_NAME=TheGraphT Chat (Dev)
      - WEBUI_SECRET_KEY=tHgPrOtOcOlSeCrEtKeY2026
      - DEFAULT_USER_ROLE=user
      - HF_TOKEN=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
      - ENABLE_RAG_WEB_SEARCH=True
      - ENABLE_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=duckduckgo
      - WEB_SEARCH_ENGINE=duckduckgo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-dev

volumes:
  backend_dev_logs:
  postgres_dev_data:
    name: thegrapht_postgres_dev_data
    external: true
  ollama_dev_data:
    name: thegrapht_ollama_dev_data
    external: true
  open_webui_dev_data:
    name: thegrapht_open_webui_dev_data
    external: true
