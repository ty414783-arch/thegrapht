server {
    listen 80;
    listen [::]:80;
    server_name thegrapht.su www.thegrapht.su;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

