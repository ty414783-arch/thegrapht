# Dev Open WebUI Gateway
server {
    listen 3012 ssl;
    listen [::]:3012 ssl;
    server_name dev.thegrapht.su;

    ssl_certificate /etc/letsencrypt/live/dev.thegrapht.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.thegrapht.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Auth check endpoint mapping
    location /api/ {
        proxy_pass http://127.0.0.1:3011/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Check authentication against dev backend
        auth_request /api/v1/auth/check-session;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_name $upstream_http_x_user_name;

        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Allow iframe embedding across ports/domains
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' https://dev.thegrapht.su https://web.thegrapht.su https://thegrapht.su;" always;

        # Disable gzip so sub_filter can modify the HTML content
        proxy_set_header Accept-Encoding "";

        # Prevent right-click inside the iframe to feel 100% native
        sub_filter '</head>' '<script>window.addEventListener("contextmenu",e=>e.preventDefault());</script></head>';
        sub_filter_once on;

        # Pass authenticated user identity to Open WebUI
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Name $user_name;
    }
}

